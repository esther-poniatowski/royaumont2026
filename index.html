<!doctype html>
<!--
  Both posters of the workshop print this address in their QR code. The page of each poster moved to
  the shared site of artifact pages, maintained in the project that owns the poster. This file only
  forwards the printed address: an anchor of the former page opens the matching poster page, and the
  bare address lets the reader choose the poster in front of them.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royaumont 2026 — posters</title>
<script>
  var site = "https://esther-poniatowski.github.io/";
  var routes = {
    "#mixture": site + "2026-10_royaumont_mixture-input-encoding_poster/",
    "#symmetry": site + "2026-10_royaumont_symmetry-lens_poster/",
    "#symmetry-references": site + "2026-10_royaumont_symmetry-lens_poster/#references"
  };
  if (routes[location.hash]) location.replace(routes[location.hash]);
</script>
<style>
  :root { --bg: #F6F3EE; --text: #171E23; --text-2: #464E54; --border: #DDDAD5; --accent: #00454D; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121819; --text: #EEF1F2; --text-2: #B2BABD; --border: #2D3638; --accent: #6CC4CC; }
  }
  body {
    margin: 0; padding: 1.5rem 1.15rem 4rem; background: var(--bg); color: var(--text);
    font: 1rem/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 1.1rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--border); }
  li:first-child { border-top: 1px solid var(--border); }
  a { display: block; padding: .85rem .55rem; color: var(--accent); font-weight: 600; text-underline-offset: 2px; }
  .sub { display: block; color: var(--text-2); font-weight: 400; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Posters at the Royaumont 2026 workshop</h1>
  <ul>
    <li><a href="https://esther-poniatowski.github.io/2026-10_royaumont_mixture-input-encoding_poster/">How do RNNs encode mixtures?<span class="sub">One network yields distinct geometries</span></a></li>
    <li><a href="https://esther-poniatowski.github.io/2026-10_royaumont_symmetry-lens_poster/">Decomposing representations through task symmetries<span class="sub">How is the structure of a task reflected in the structure of representations?</span></a></li>
  </ul>
</main>
</body>
</html>
